<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Property | ADEKANLE AND ADEKANLE REAL ESTATE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body class="upload-page">
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">ADEKANLE AND ADEKANLE <span> REAL ESTATE</span></a>
            <div class="nav-links">
                <a href="index.html#home">Home</a>
                <a href="index.html#listings">Listings</a>
                <a href="index.html#services">Services</a>
                <a href="index.html#contact" class="btn-contact">Contact</a>
            </div>
            <button class="menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <section class="manage-listings" id="manage-listings">
        <div class="container">
            <h2 class="section-title">Upload Property</h2>
            <p class="section-subtitle">Add a property listing directly from this admin page (saved to backend database on Render).</p>
            <div class="contact-form">
                <form id="addPropertyForm">
                    <div class="form-group">
                        <input type="text" name="title" placeholder="Property Title" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="location" placeholder="Location" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="price" placeholder="Price (e.g. $450,000)" required>
                    </div>
                    <div class="form-group">
                        <input type="number" name="beds" placeholder="Beds" min="0" required>
                    </div>
                    <div class="form-group">
                        <input type="number" name="baths" placeholder="Baths" min="0" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="size" placeholder="Size in sqft" required>
                    </div>
                    <div class="form-group">
                        <select name="listingType" required>
                            <option value="" disabled selected>Listing Type</option>
                            <option>For Sale</option>
                            <option>For Rent</option>
                            <option>Commercial</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <select name="category" required>
                            <option value="" disabled selected>Category</option>
                            <option value="house">House</option>
                            <option value="apartment">Apartment</option>
                            <option value="commercial">Commercial</option>
                            <option value="land">Land</option>
                            <option value="joint-venture">Joint venture</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="url" name="image" placeholder="Image URL (optional)">
                    </div>
                    <div class="form-group">
                        <input type="password" name="adminApiKey" placeholder="Admin API Key" autocomplete="off" required>
                    </div>
                    <button type="submit" class="btn-primary">Upload Property</button>
                    <p id="addPropertyStatus" class="form-status" aria-live="polite"></p>
                </form>
            </div>
        </div>
    </section>

    <script src="style.js"></script>
</body>
</html>
